<h1>Available Sessions</h1>

{% for session in sessions %}
  <div>
    <p>
      <strong>{{ session.court.name }}</strong><br>
      {{ session.start_time }} – {{ session.end_time }}<br>
      Type: {{ session.get_session_type_display }}
    </p>

    <form method="get" action="{% url 'book_session_page' session.id %}">
      <button type="submit">Book</button>
    </form>
  </div>
  <hr>
{% empty %}
  <p>No sessions available.</p>
{% endfor %}
