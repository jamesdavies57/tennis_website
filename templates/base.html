<!DOCTYPE html>
<html>
<head>
    <title>Tennis Club</title>
</head>
<body>

{% if messages %}
  {% for message in messages %}
    <p>{{ message }}</p>
  {% endfor %}
{% endif %}

{% if user.is_authenticated %}
  <p>Logged in as {{ user.email }}</p>
{% endif %}

<hr>

{% block content %}
{% endblock %}

</body>
</html>
